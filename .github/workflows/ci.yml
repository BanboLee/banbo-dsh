name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Keep pnpm in development mode so devDependencies (the plugin bundles'
  # @deepseek-ai family and the vitest toolchain) are always installed and
  # visible to `pnpm list` assertions, regardless of runner defaults.
  NODE_ENV: development

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The composition suite boots real isolated DSH profiles, so the dsh
      # CLI (and its bundled @deepseek-ai package tree) must be on PATH. The
      # version must match the plugin dependency family (AGENTS.md).
      - name: Install dsh CLI
        run: npm install -g @deepseek-ai/dsh@0.1.5-rc.2

      # Gate B resolves the TUI's own roster patch to prove the two seats are
      # disjoint, and it finds it beside the global `dsh`, not inside it: the
      # TUI ships as a separate global package. Without this the gate fails with
      # `cannot resolve Gate B package @deepseek-harness-tui/dsh-tui`. The
      # version is the one Gate B's assertions name.
      - name: Install dsh TUI package (Gate B)
        run: npm install -g @deepseek-harness-tui/dsh-tui@0.10.2

      # fish-shell bundle composition tests execute the real fish binary.
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish

      # The agents Host Remote / Typert descriptors / Web client are build
      # outputs (docs/agents-plugin-plan.md §17). Build before the gates lane,
      # whose packed test asserts the published tarball and pure-ESM imports.
      - name: Build agents bundle artifacts
        run: pnpm build:agents

      - name: Run test suite
        run: pnpm test

      # Gate green is its own lane: it must not be inferred from an overall
      # green unit run (docs/agents-plugin-plan.md §15).
      - name: Run agents platform gates
        run: pnpm test:agents:gates

      # The real install/uninstall cycle is opt-in inside the suite (it shells
      # out to the `dsh` CLI), so CI enables it explicitly. This is what makes
      # the §18 install/uninstall claim enforced rather than remembered.
      - name: Run agents install/uninstall lane
        env:
          BANBO_REAL_INSTALL: '1'
        run: >-
          npx vitest run --config vitest.gates.config.ts
          plugins/agents/tests/gates/gate-f-install.spec.ts

  # The composition suite boots REAL isolated DSH profiles and real subprocesses
  # (a fake LSP server, a real `dsh` CLI). That is a different kind of test from
  # the unit suite, and it was sharing a 2-core runner with it: it failed only on
  # CI, only in the teardown path, and passed on a developer machine with the
  # same engine version. Its own job, with file parallelism off, gives a clean
  # signal either way — if it still fails here, contention was not the cause and
  # the failure is real and reproducible in isolation.
  composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # These specs shell out to the `dsh` CLI to boot profiles, so it must be on
      # PATH at the version the plugin family is pinned to (AGENTS.md).
      - name: Install dsh CLI
        run: npm install -g @deepseek-ai/dsh@0.1.5-rc.2

      # fish-shell is the only shell these profiles mount, so without the binary
      # the sandbox executor refuses to run anything: fish-rtk-coexist.spec.ts
      # fails with `spawn fish ENOENT` wrapped in SandboxUnavailableError.
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish

      - name: Run composition suite
        run: pnpm test:composition

  # docs/agents-plugin-plan.md §8.7 requires the generated-preset pointer
  # mechanism to be verified on Windows: a directory symlink needs Developer
  # Mode or elevation there, so the junction fallback is the branch that
  # actually runs in production. The full repository suite is POSIX-only (fish,
  # pty, rtk tmpdir normalisation), so this job runs the agents bundle.
  #
  # Gate B is deliberately NOT part of this job: it boots real isolated DSH
  # profiles through the `dsh` CLI, and its Windows behaviour is not yet
  # established. That remains a documented gap, not a silent pass.
  agents-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build agents bundle artifacts
        run: pnpm build:agents

      # Includes the Windows-only pointer probe in
      # plugins/agents/tests/preset-compiler.spec.ts, which is skipped on POSIX.
      - name: Run agents unit suite
        run: npx vitest run plugins/agents/tests

      - name: Run platform gates that need no real profile
        run: >-
          npx vitest run --config vitest.gates.config.ts
          plugins/agents/tests/gates/gate-a-target.spec.ts
          plugins/agents/tests/gates/gate-c-scope-depth.spec.ts
          plugins/agents/tests/gates/gate-d-lifecycle.spec.ts
          plugins/agents/tests/gates/gate-e-settings-web.spec.ts
