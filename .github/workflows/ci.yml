name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Keep pnpm in development mode so devDependencies (the plugin bundles'
  # @deepseek-ai family and the vitest toolchain) are always installed and
  # visible to `pnpm list` assertions, regardless of runner defaults.
  NODE_ENV: development

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gates lane needs this, not the composition suite (which is its own
      # job): Gate B resolves `@deepseek-ai/dsh-app-boot` and the real 0.2.2-rc.1
      # packages beside the global `dsh`, and the install/uninstall gate shells
      # out to `dsh`. The version must match the plugin dependency family
      # (AGENTS.md).
      - name: Install dsh CLI
        run: npm install -g @deepseek-ai/dsh@0.2.2-rc.1

      # gate-b's B4 probes resolve `dsh-tui` beside the global `dsh`; without it
      # they skip, so use the pinned TUI for the active 0.2.2-rc.1 family.
      - name: Install dsh TUI
        run: npm install -g @deepseek-harness-tui/dsh-tui@0.19.0

      # The real fish PTY lane runs in this job (`DSH_REAL_FISH_PTY=1` below),
      # so the binary has to be here; that spec still skips itself when fish is
      # missing from PATH.
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish

      # The agents Host Remote / Typert descriptors / Web client are build
      # outputs (docs/agents-plugin-plan.md §17). Build before the gates lane,
      # whose packed test asserts the published tarball and pure-ESM imports.
      - name: Build agents bundle artifacts
        run: pnpm build:agents

      # `pnpm test` never runs tsc, so every maintained plugin is checked here:
      # without it a deleted or renamed API can regress while the suite stays
      # green. Runs after the agents build so the emitted declarations exist.
      - name: Typecheck every maintained plugin tsconfig
        run: pnpm typecheck

      # The real fish PTY lane is ON in this job: fish is installed above, and
      # that spec gates itself on the binary being on PATH, so a runner without
      # fish still skips instead of failing. The CodeGraph-based legacy headless
      # suite is frozen and excluded from the maintained test/release lanes.
      - name: Run test suite
        env:
          DSH_REAL_FISH_PTY: '1'
        run: pnpm test

      # Gate green is its own lane: it must not be inferred from an overall
      # green unit run (docs/agents-plugin-plan.md §15).
      - name: Run agents platform gates
        run: pnpm test:agents:gates

      # The real install/uninstall cycle is opt-in inside the suite (it shells
      # out to the `dsh` CLI), so CI enables it explicitly. This is what makes
      # the §18 install/uninstall claim enforced rather than remembered.
      - name: Run agents install/uninstall lane
        env:
          BANBO_REAL_INSTALL: '1'
        run: >-
          npx vitest run --config vitest.gates.config.ts
          plugins/agents/tests/gates/gate-f-install.spec.ts

  # D7: the L2 fish PTY lane must hold on macOS too, not only on the Linux
  # runner the `test` job uses. This job turns it on with the SAME switch as
  # there (DSH_REAL_FISH_PTY=1, deliberately no second env): the older real specs
  # self-skip when `fish` is missing from PATH, so installing the binary is what
  # makes them execute instead of skip, while the new L2 session spec
  # (plugins/fish-shell/tests/terminal-session-real.spec.ts) boots a real
  # isolated profile through the `dsh` CLI and FAILS LOUD when that CLI is
  # missing — hence the dsh CLI step below, the same one the `test` job uses.
  #
  # macOS deliberately runs a TARGETED set instead of the whole suite; ubuntu's
  # full suite (with the same switch) lives in the `test` job. The run step below
  # lists the three pre-existing macOS assumptions that keep the rest of the
  # suite off this runner.
  fish-pty-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The real lane shells out to `dsh plugin` to build its isolated profile,
      # so the CLI must be on PATH at the version the plugin family is pinned to
      # (AGENTS.md). Without it that spec fails instead of skipping.
      - name: Install dsh CLI
        run: npm install -g @deepseek-ai/dsh@0.2.2-rc.1

      # The real L2 spec FAILS LOUD when fish is missing, so this is the step
      # that makes the lane execute.
      - name: Install fish
        run: brew install fish

      # Targeted set on purpose — the repository suite carries three pre-existing
      # macOS assumptions this bundle does not own and that fail on this runner:
      #   * tests/qa/go-tool.spec.ts: "Error: test requires Go" (no Go toolchain);
      #   * tests/qa/pty.spec.ts: unix-socket injection does not work on macOS
      #     ("injection socket readiness deadline exceeded" / connect ENOTSOCK
      #     .../session.sock);
      #   * the QA layout assertion `layout.runtimeHome.length < 60` cannot hold
      #     under macOS's /var/folders/... temp path.
      # The full suite (same DSH_REAL_FISH_PTY=1 switch) runs on ubuntu in the
      # `test` job, so this job is the macOS complement: the real L2 lane plus
      # the fish-shell contract tests. It calls the resolved vitest entry point
      # rather than the pnpm wrapper, so the invocation does not depend on how
      # pnpm exposes the binary. Fail-loud: no `continue-on-error`.
      - name: Run the macOS fish PTY and fish-shell contract set
        env:
          DSH_REAL_FISH_PTY: '1'
        run: >-
          node node_modules/vitest/vitest.mjs run
          plugins/fish-shell/tests/terminal-session-real.spec.ts
          plugins/fish-shell/tests/bundle.spec.ts
          plugins/fish-shell/tests/terminal-tools.spec.ts
          plugins/fish-shell/tests/bundled-version.spec.ts
          plugins/fish-shell/tests/packed-files.spec.ts
          plugins/fish-shell/tests/terminal-tool-names.spec.ts
          tests/package-shape.spec.ts
          tests/docs-shape-fish-shell.spec.ts

  # D8 / v1 gate 2: the packed plugin must install AND really load in an
  # OFFLINE profile. This is a required push/PR job — deliberately not a
  # workflow_dispatch lane and not `continue-on-error`.
  #
  # The job only provides the tools: scripts/qa/fish-packed-offline.mjs owns the
  # whole lane. It stages the bundle into a temp tree OUTSIDE the checkout (a
  # `--prod --config.node-linker=hoisted` install in the checkout would prune the
  # workspace devDependencies and rewrite its node_modules), packs it there with
  # the hoisted linker pnpm demands for bundledDependencies, builds a temporary
  # profile under an isolated DSH_HOME, installs the tarball with
  # `--offline --config.auto-install-peers=false`, boots the profile and asserts
  # the real load. It exits non-zero on any failure.
  #
  # This job runs NO workspace `pnpm install`, and therefore sets NO pnpm cache.
  # `actions/setup-node`'s `cache: pnpm` caches `pnpm store path`; with no install
  # there is no store, and the action's POST step fails the job with "Path(s)
  # specified in the action for caching were not found". The lane does not need
  # one: it packs in a temp tree with its own `--store-dir`, and it loads the
  # agent runtime from the GLOBAL `dsh` installation (`dshPackageRoot()`), never
  # from the checkout's `node_modules`. Installing the workspace here purely to
  # populate a cache would be strictly slower than the lane itself.
  fish-packed-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      # NO `cache: pnpm` HERE, deliberately — see the note above this job.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      # The lane needs `dsh` (it shells out to `dsh plugin` to build and install
      # its isolated profile) as well as the `pnpm` set up above, so the CLI must
      # be on PATH at the version the plugin family is pinned to (AGENTS.md).
      - name: Install dsh CLI
        run: npm install -g @deepseek-ai/dsh@0.2.2-rc.1

      # This single step is the gate: the script stages the bundle, packs it with
      # the hoisted linker, installs the tarball with `--offline` into a profile
      # under an isolated DSH_HOME (never the real ~/.config/dsh), boots it and
      # asserts the plugin really loads (the six terminal_* tools visible,
      # listBackends() non-empty). It exits non-zero on any failure — not a
      # smoke print.
      - name: Install and load the packed bundle offline
        run: node scripts/qa/fish-packed-offline.mjs

  # The composition suite boots REAL isolated DSH profiles and real subprocesses
  # (a fake LSP server, a real `dsh` CLI). That is a different kind of test from
  # the unit suite, and it was sharing a 2-core runner with it: it failed only on
  # CI, only in the teardown path, and passed on a developer machine with the
  # same engine version. Its own job, with file parallelism off, gives a clean
  # signal either way — if it still fails here, contention was not the cause and
  # the failure is real and reproducible in isolation.
  composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # These specs shell out to the `dsh` CLI to boot profiles, so it must be on
      # PATH at the version the plugin family is pinned to (AGENTS.md).
      - name: Install dsh CLI
        run: npm install -g @deepseek-ai/dsh@0.2.2-rc.1

      # `tests/composition/fish-pty-dsh-tui.spec.ts` needs the REAL global
      # dsh-tui beside that CLI: it resolves the package the way the QA infra
      # does, `targetTuiPackagePath(realpathSync(dsh))`, i.e.
      # <nodeRoot>/lib/node_modules/@deepseek-harness-tui/dsh-tui — exactly where
      # a global npm install lands (the `dsh` on PATH is a symlink from
      # <nodeRoot>/bin into that same lib/node_modules tree). Without this
      # package the lane's self-gate reports a SKIP that names it, which is why
      # the composition was never exercised here. Verified locally both ways:
      # with the package present the lane runs (5 passed), and a `dsh` whose
      # sibling package is absent turns the same lane into 1 skipped.
      # Same pin the `test` job uses for its dsh-tui probes.
      - name: Install dsh TUI
        run: npm install -g @deepseek-harness-tui/dsh-tui@0.19.0 --no-audit --no-fund

      # fish-shell is the only shell these profiles mount, so without the binary
      # the sandbox executor refuses to run anything: fish-rtk-coexist.spec.ts
      # fails with `spawn fish ENOENT` wrapped in SandboxUnavailableError.
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish

      - name: Run composition suite
        run: pnpm test:composition

  # docs/agents-plugin-plan.md §8.7 requires the generated-preset pointer
  # mechanism to be verified on Windows: a directory symlink needs Developer
  # Mode or elevation there, so the junction fallback is the branch that
  # actually runs in production. The full repository suite is POSIX-only (fish,
  # pty, rtk tmpdir normalisation), so this job runs the agents bundle.
  #
  # Gate B is deliberately NOT part of this job: it boots real isolated DSH
  # profiles through the `dsh` CLI, and its Windows behaviour is not yet
  # established. That remains a documented gap, not a silent pass.
  agents-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build agents bundle artifacts
        run: pnpm build:agents

      # Includes the Windows-only pointer probe in
      # plugins/agents/tests/preset-compiler.spec.ts, which is skipped on POSIX.
      - name: Run agents unit suite
        run: npx vitest run plugins/agents/tests

      - name: Run platform gates that need no real profile
        run: >-
          npx vitest run --config vitest.gates.config.ts
          plugins/agents/tests/gates/gate-a-target.spec.ts
          plugins/agents/tests/gates/gate-c-scope-depth.spec.ts
          plugins/agents/tests/gates/gate-d-lifecycle.spec.ts
          plugins/agents/tests/gates/gate-e-settings-web.spec.ts

