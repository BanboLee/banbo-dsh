name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The real headless e2e lane (tests/e2e/**, RUN_REAL_HEADLESS_E2E=1) needs two
  # third-party artifacts this repository does not vendor, so it never joins the
  # push/PR pipeline. A manual dispatch runs the whole pipeline and, with it,
  # the self-provisioning `real-e2e` job at the bottom of this file.
  workflow_dispatch:
    inputs:
      rtk_version:
        description: rtk release tag to download (github.com/rtk-ai/rtk)
        required: false
        default: v0.50.0
      codegraph_ref:
        description: codegraph git ref to build (github.com/colbymchenry/codegraph)
        required: false
        default: v1.6.0

env:
  # Keep pnpm in development mode so devDependencies (the plugin bundles'
  # @deepseek-ai family and the vitest toolchain) are always installed and
  # visible to `pnpm list` assertions, regardless of runner defaults.
  NODE_ENV: development

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gates lane needs this, not the composition suite (which is its own
      # job): Gate B resolves `@deepseek-ai/dsh-app-boot` and the real 0.1.7
      # packages beside the global `dsh`, and the install/uninstall gate shells
      # out to `dsh`. The version must match the plugin dependency family
      # (AGENTS.md).
      - name: Install dsh CLI
        run: npm install -g @deepseek-ai/dsh@0.1.7-rc.2

      # The real fish PTY lane runs in this job (`DSH_REAL_FISH_PTY=1` below),
      # so the binary has to be here; that spec still skips itself when fish is
      # missing from PATH.
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish

      # The agents Host Remote / Typert descriptors / Web client are build
      # outputs (docs/agents-plugin-plan.md §17). Build before the gates lane,
      # whose packed test asserts the published tarball and pure-ESM imports.
      - name: Build agents bundle artifacts
        run: pnpm build:agents

      # `pnpm test` never runs tsc, so every plugin's tsconfig is checked here:
      # without it a deleted or renamed API can regress while the suite stays
      # green. Runs after the agents build so the emitted declarations exist.
      - name: Typecheck every plugin tsconfig
        run: pnpm typecheck

      # The real fish PTY lane is ON in this job: fish is installed above, and
      # that spec gates itself on the binary being on PATH, so a runner without
      # fish still skips instead of failing. The headless real e2e lane stays
      # opt-in (RUN_REAL_HEADLESS_E2E=1) for a different reason: it needs the
      # real `rtk` and `codegraph` binaries, which this runner does not have.
      - name: Run test suite
        env:
          DSH_REAL_FISH_PTY: '1'
        run: pnpm test

      # Gate green is its own lane: it must not be inferred from an overall
      # green unit run (docs/agents-plugin-plan.md §15).
      - name: Run agents platform gates
        run: pnpm test:agents:gates

      # The real install/uninstall cycle is opt-in inside the suite (it shells
      # out to the `dsh` CLI), so CI enables it explicitly. This is what makes
      # the §18 install/uninstall claim enforced rather than remembered.
      - name: Run agents install/uninstall lane
        env:
          BANBO_REAL_INSTALL: '1'
        run: >-
          npx vitest run --config vitest.gates.config.ts
          plugins/agents/tests/gates/gate-f-install.spec.ts

  # The composition suite boots REAL isolated DSH profiles and real subprocesses
  # (a fake LSP server, a real `dsh` CLI). That is a different kind of test from
  # the unit suite, and it was sharing a 2-core runner with it: it failed only on
  # CI, only in the teardown path, and passed on a developer machine with the
  # same engine version. Its own job, with file parallelism off, gives a clean
  # signal either way — if it still fails here, contention was not the cause and
  # the failure is real and reproducible in isolation.
  composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # These specs shell out to the `dsh` CLI to boot profiles, so it must be on
      # PATH at the version the plugin family is pinned to (AGENTS.md).
      - name: Install dsh CLI
        run: npm install -g @deepseek-ai/dsh@0.1.7-rc.2

      # fish-shell is the only shell these profiles mount, so without the binary
      # the sandbox executor refuses to run anything: fish-rtk-coexist.spec.ts
      # fails with `spawn fish ENOENT` wrapped in SandboxUnavailableError.
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish

      - name: Run composition suite
        run: pnpm test:composition

  # docs/agents-plugin-plan.md §8.7 requires the generated-preset pointer
  # mechanism to be verified on Windows: a directory symlink needs Developer
  # Mode or elevation there, so the junction fallback is the branch that
  # actually runs in production. The full repository suite is POSIX-only (fish,
  # pty, rtk tmpdir normalisation), so this job runs the agents bundle.
  #
  # Gate B is deliberately NOT part of this job: it boots real isolated DSH
  # profiles through the `dsh` CLI, and its Windows behaviour is not yet
  # established. That remains a documented gap, not a silent pass.
  agents-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build agents bundle artifacts
        run: pnpm build:agents

      # Includes the Windows-only pointer probe in
      # plugins/agents/tests/preset-compiler.spec.ts, which is skipped on POSIX.
      - name: Run agents unit suite
        run: npx vitest run plugins/agents/tests

      - name: Run platform gates that need no real profile
        run: >-
          npx vitest run --config vitest.gates.config.ts
          plugins/agents/tests/gates/gate-a-target.spec.ts
          plugins/agents/tests/gates/gate-c-scope-depth.spec.ts
          plugins/agents/tests/gates/gate-d-lifecycle.spec.ts
          plugins/agents/tests/gates/gate-e-settings-web.spec.ts

  # The real headless lane (`tests/e2e/**`, gated by RUN_REAL_HEADLESS_E2E=1)
  # exercises the local bundles against the real rtk and codegraph CLIs, so it
  # needs two third-party artifacts this repository does not vendor. The lane
  # pins their paths and refuses to run without them
  # (tests/e2e/headless-real-runtime.ts), and this job provisions them there:
  #   ../rtk/target/release/rtk            published rtk release, checksum-verified
  #   ../codegraph/dist/bin/codegraph.js   source build of the public repo
  # Both siblings hang off `dirname(repoRoot)`, which is what the checkout
  # already gives this job. Manual dispatch only: it downloads third-party
  # artifacts, which the deterministic push/PR pipeline must not depend on
  # (AGENTS.md, "真实 headless e2e 车道").
  real-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      # Node 22 is what the lane asserts and what codegraph supports. The global
      # `dsh` installed below lands in this same node's bin directory, which is
      # how the lane discovers its `node`: it looks beside `dsh` before PATH.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install dsh CLI
        run: npm install -g @deepseek-ai/dsh@0.1.7-rc.2

      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish

      - name: Provision the real rtk CLI at the pinned sibling path
        env:
          RTK_VERSION: ${{ inputs.rtk_version || 'v0.50.0' }}
        run: |
          set -euo pipefail
          asset=rtk-x86_64-unknown-linux-musl.tar.gz
          base="https://github.com/rtk-ai/rtk/releases/download/${RTK_VERSION}"
          curl -fsSL -o "/tmp/${asset}" "${base}/${asset}"
          curl -fsSL -o /tmp/rtk-checksums.txt "${base}/checksums.txt"
          (cd /tmp && grep " ${asset}\$" rtk-checksums.txt | sha256sum -c -)
          mkdir -p ../rtk/target/release
          tar -xzf "/tmp/${asset}" -C ../rtk/target/release rtk
          chmod +x ../rtk/target/release/rtk
          ../rtk/target/release/rtk --version

      - name: Provision the real codegraph CLI at the pinned sibling path
        env:
          CODEGRAPH_REF: ${{ inputs.codegraph_ref || 'v1.6.0' }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${CODEGRAPH_REF}" \
            https://github.com/colbymchenry/codegraph.git ../codegraph
          cd ../codegraph
          # `npm ci` skips devDependencies when NODE_ENV=production, and the
          # build needs the repository's own tsc, so include them explicitly.
          NODE_ENV=development npm ci --include=dev --no-audit --no-fund
          NODE_ENV=development npm run build
          node dist/bin/codegraph.js --version

      - name: Run the real headless e2e lane
        run: pnpm test:e2e:headless
