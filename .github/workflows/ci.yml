name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Keep pnpm in development mode so devDependencies (the plugin bundles'
  # @deepseek-ai family and the vitest toolchain) are always installed and
  # visible to `pnpm list` assertions, regardless of runner defaults.
  NODE_ENV: development

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The composition suite boots real isolated DSH profiles, so the dsh
      # CLI (and its bundled @deepseek-ai package tree) must be on PATH.
      - name: Install dsh CLI
        run: npm install -g @deepseek-ai/dsh@0.1.5-rc.1

      # fish-shell bundle composition tests execute the real fish binary.
      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish

      - name: Run test suite
        run: pnpm test
