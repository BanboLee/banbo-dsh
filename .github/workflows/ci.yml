name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Keep pnpm in development mode so devDependencies (the plugin bundles'
  # @deepseek-ai family and the vitest toolchain) are always installed and
  # visible to `pnpm list` assertions, regardless of runner defaults.
  NODE_ENV: development

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test suite
        run: pnpm test
