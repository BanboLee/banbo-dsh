name: Release

# Publishing is MANUAL ONLY: this workflow is never triggered by a push or a
# pull request, so nothing reaches the registry without a human dispatch.
# `dry_run` defaults to true — a dispatch packs and validates the artefact, and
# only an explicit `dry_run: false` really publishes.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and verify without publishing; set to false to publish for real'
        type: boolean
        default: true

# `contents: read` is all the checkout needs.
#
# `id-token: write` is what lets the run request the GitHub OIDC token that npm
# provenance is signed with. It is minted per run, so there is no long-lived
# secret behind provenance itself.
permissions:
  contents: read
  id-token: write

env:
  # Keep pnpm in development mode so devDependencies (vitest and the plugin
  # bundles' @deepseek-ai family) are installed for the checks below; a
  # NODE_ENV=production install would silently skip them.
  NODE_ENV: development

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Nothing may reach the registry unless the deterministic suite is green.
      # `pnpm test` never runs tsc, so the plugin tsconfigs are checked
      # separately (AGENTS.md).
      - name: Run the deterministic test suite
        run: pnpm test

      - name: Typecheck every plugin tsconfig
        run: pnpm typecheck

      # The bundle is PUBLISHED FROM A STAGED COPY, never from the checkout.
      # The package ships `@deepseek-ai/dsh-tool-terminal` through
      # `bundledDependencies`, and in the repository's isolated (symlinked)
      # node_modules the bundled dependency's transitive deps resolve through
      # `.pnpm`, so npm records them as `package/../../node_modules/.pnpm/...`
      # members — a tarball whose members escape the package root (40 of them,
      # verified locally). A hoisted install on a copy outside the workspace
      # makes those paths resolve inside the package instead: the same staging
      # the repository's packed-offline lane uses, and the only shape whose
      # members all live under `package/`.
      #
      # `--config.package-import-method=copy` is load-bearing, not a tweak:
      # pnpm's default import method materializes store files as HARDLINKS, and
      # when the staged tree keeps them the packing step writes hardlink members
      # (`hrw-r--r-- … link to …`) that npmjs REJECTS with
      # `415 Unsupported Media Type … Hard link is not allowed` (hit during the
      # 0.8.0 publish: schemastery/LICENSE and cosmokit/LICENSE were two links to
      # one inode). Copying keeps the staged tree hardlink-free, and the guard
      # below asserts that it stayed that way.
      - name: Stage the bundle outside the workspace with the hoisted linker
        run: |
          set -euo pipefail
          STAGE="$(mktemp -d)"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          cp -R plugins/fish-shell "$STAGE/pkg"
          rm -rf "$STAGE/pkg/node_modules"
          (cd "$STAGE/pkg" && pnpm install --prod --config.node-linker=hoisted --config.package-import-method=copy --config.auto-install-peers=false)

      # Cheap precondition for the publish below, and the only place the
      # REGISTRY's structural rules are checked (nothing here can be found by
      # `npm publish --dry-run`: a dry run never uploads, so the registry never
      # applies them — that is exactly how the 415 below reached a real publish):
      #   * every member lives under `package/` and none contains a `..`
      #     component — a member like `package/../../node_modules/.pnpm/...`
      #     still starts with `package/`, so both checks are needed;
      #   * no member is a HARDLINK (npmjs 415 "Hard link is not allowed");
      #   * a symlink member, if one ever appears, resolves inside `package/`:
      #     an absolute target or any `..` component is rejected (npm tarballs
      #     carry no symlinks at all, so the conservative rule costs nothing and
      #     a permissive one would be the wrong default on a publish gate).
      - name: Assert the tarball is publishable (no escaping members, no hardlinks)
        run: |
          set -euo pipefail
          mkdir -p "$STAGE/check"
          (cd "$STAGE/pkg" && npm pack --pack-destination "$STAGE/check" --provenance=false >/dev/null)
          members="$(tar -tzf "$STAGE"/check/*.tgz)"
          if printf '%s\n' "$members" | grep -qE '(^|/)\.\.(/|$)' || printf '%s\n' "$members" | grep -qv '^package/'; then
            echo 'error: tarball members escape the package root:' >&2
            printf '%s\n' "$members" | grep -E '(^|/)\.\.(/|$)' >&2
            exit 1
          fi
          listing="$(tar -tvzf "$STAGE"/check/*.tgz)"
          hardlinks="$(printf '%s\n' "$listing" | grep -E '^h' || true)"
          if [ -n "$hardlinks" ]; then
            echo 'error: tarball contains hardlink members; npmjs rejects them with 415 Hard link is not allowed:' >&2
            printf '%s\n' "$hardlinks" >&2
            exit 1
          fi
          symlink_targets="$(printf '%s\n' "$listing" | grep -E '^l' | sed -E 's/^.* -> //' || true)"
          if [ -n "$symlink_targets" ]; then
            escaping_links="$(printf '%s\n' "$symlink_targets" | grep -E '^/|(^|/)\.\.(/|$)' || true)"
            if [ -n "$escaping_links" ]; then
              echo 'error: symlink members must resolve inside the package root (absolute target or `..` component):' >&2
              printf '%s\n' "$escaping_links" >&2
              exit 1
            fi
          fi
          printf '%s\n' "$members" | grep -E '^package/node_modules/@deepseek-ai/dsh-tool-terminal/package.json$'

      # The default path: pack the bundle and print what would be uploaded
      # (`npm publish --dry-run` lists the tarball contents) without touching
      # the registry. Provenance is switched off here on purpose — the dry run
      # must not depend on an OIDC exchange to be a useful smoke check.
      - name: Verify the packed artefact (dry run)
        if: ${{ inputs.dry_run }}
        run: cd "$STAGE/pkg" && npm publish --dry-run --provenance=false

      # The real publish, reachable only through an explicit `dry_run: false`.
      # `publishConfig.provenance` is already true; `--provenance` is passed
      # explicitly so the requirement is visible in the run. Provenance needs
      # the OIDC token from `id-token: write` above (npm builds the attestation
      # from the GITHUB_* environment), which is why a workstation publish has
      # to use `--no-provenance` (plugins/fish-shell/README.md).
      #
      # Authentication is deliberately not wired to a secret here. The two
      # supported paths are:
      #   * npm TRUSTED PUBLISHING configured on npmjs.com for this repository
      #     and workflow (tokenless, OIDC-based). It needs npm CLI >= 11.5.1, so
      #     if the runner's bundled npm is older, install a newer one first.
      #   * a granular access token passed as `NODE_AUTH_TOKEN`
      #     (`# env:` / `#   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}`).
      # 2FA on the npm account or organization is a publish prerequisite: npm
      # checks it registry-side, this repository cannot verify it, and provenance
      # does not replace it.
      - name: Publish @banbolee/dsh-fish-shell
        if: ${{ !inputs.dry_run }}
        run: cd "$STAGE/pkg" && npm publish --provenance --access public
