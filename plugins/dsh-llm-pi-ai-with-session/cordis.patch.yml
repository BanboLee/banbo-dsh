# @banbolee/dsh-llm-pi-ai-with-session bundle: mount the session wrapper LLM provider route.
#
# The plugin registers one provider route (default `pi-ai-session`) whose
# requests carry the live dsh session id in a configurable HTTP header
# (default `x-session-id`). The route reuses pi-ai's openai-completions wire
# implementation against the configured gateway, so the models configured on
# the route keep working unchanged while every request additionally
# identifies its dsh session.
#
# The route is INSERTED as a plugin row, not patched into llm-pi-ai: the
# harness's own adapter owns the existing pi-ai routes and withholds the
# session-affinity compat switch, so a separate route registered through the
# public `ctx.llm.registerAdapter` seam is the supported extension point.
- insert:
    - id: llm-pi-ai-with-session
      name: '@banbolee/dsh-llm-pi-ai-with-session'
