# @banbolee/dsh-rtk bundle: decorate the mounted shell executor with `rtk rewrite`.
#
# This bundle does NOT mount a shell provider. It loads a plain function
# plugin that injects the live `ctx.shell` and wraps its `run`/`start` methods
# so every command is transparently rewritten through `rtk rewrite` before the
# delegate executes it. Because it decorates instead of replacing, it coexists
# with whichever shell executor the host mounts (bash-sandbox, fish-shell, ...)
# — exactly one `ctx.shell` provider remains mounted and no duplicate service
# registration can occur.
- insert:
    - id: rtk
      name: '@banbolee/dsh-rtk'
