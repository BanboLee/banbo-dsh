# @banbolee/dsh-fish-shell bundle: run commands with fish instead of bash,
# on every surface and under every agent preset.
#
# How it works now:
#   - The base bash executor (`bash-sandbox`) and the host bash tool
#     (`tool-bash`) are disabled at the host plane, the fish executor
#     (ctx.shell) is mounted, and a host-global `fish` tool is registered
#     (`fish-shell` + `tool-fish` rows below). Headless (no preset roster)
#     agents therefore see only the `fish` tool.
#   - Presets are NOT touched: the roster default stays `standard`, and no
#     bundled preset root or user copy is installed. Standard/ptc/cordis/
#     minimal/third-party presets keep registering their own `bash`-named
#     tool at the preset standing scope.
#   - `fish-preset-policy` fixes that per agent at the agent boundary: on
#     `agent/created` and on every `tools/change` (preset recompose) it
#     calls `agent.ctx.tools.restrict({ deny: ['bash'] })` to hide the
#     preset-inherited bash tool and registers an empty agent-scoped
#     `tool:bash` prompt section that shadows the preset's static bash
#     guidance. The agent ends up with exactly one shell tool: `fish`.
#
# Boundaries:
#   - `minimal` keeps its persistent PTY bash machinery mounted. When the
#     policy detects the persistent bash form (a `bash` tool whose
#     parameters carry only `command` and whose output schema is a plain
#     string), it registers a persistent `fish` tool at the agent scope
#     (shadowing the host one-shot fish) before hiding bash, so minimal
#     sessions keep their persistent semantics — cwd, variables, and
#     functions survive across calls — in fish.
#   - The persistent fish PTY is SELF-MANAGED by the policy: `persistent.js`
#     owns a `FishTerminalBackend` instance and calls `backend.spawn(...)`
#     directly. Nothing is registered in the `terminals` registry (which is
#     entry-local to the `minimal` preset and invisible at the host/agent
#     plane), so the bundle must NOT mount the `terminal-fish` plugin row
#     here — that would leave the entry pending forever in host-plane
#     profiles (headless, dsh-tui, composition tests) that have no
#     `terminals` service.
#   - A third-party preset that allowlists the global `fish` tool out (or
#     registers its shell tool under a non-`bash` name) is left as authored,
#     with a one-time warning per agent.
- id: bash-sandbox
  disabled: true

- id: tool-bash
  disabled: true

- insert:
    - id: fish-shell
      name: '@banbolee/dsh-fish-shell'

    - id: tool-fish
      name: '@banbolee/dsh-fish-shell/tool'

    - id: fish-preset-policy
      name: '@banbolee/dsh-fish-shell/policy'
# ── L2 interactive terminal sessions (fish-shell-tty-v3 §3.1) ───────────────────
# A self-contained group: `isolate.terminals` keeps the `terminals` service
# entry-local to the group (mounting it at the host plane would leave the entry
# pending in profiles whose host plane has no `terminals` service). Inside it:
#   - `pty`               the official terminal registry;
#   - `terminal-fish-pty` this bundle's `terminal` module: the OFFICIAL
#     `@deepseek-ai/dsh-terminal-bash` backend, driven with fish argv, PLUS the
#     harness home contract (`DSH_HOME`, `DSH_PROFILE`, `DSH_PROFILE_DIR`) in
#     the PTY child environment — the same facts the one-shot `fish` tool gets
#     from `ctx.shellEnv`, so a nested `dsh` resolves the real harness home
#     instead of `~/.dsh`. The row used to mount the official package directly;
#     it cannot any more because that row has no `env` config field and its
#     `childEnvironment()` is module-private, so owning the row is the only way
#     to add the contract without editing or patching the official module.
#     Everything else is still the official class (see `terminal.js`): the
#     backend type stays `shell`, argv confinement and the sandbox-mode fence
#     stay official, and readiness still comes from `session.initialize()`.
#     The prompt setup rides in `-C` (startup submits nothing) so the motd stays
#     clean — feeding the same setup through PTY input gets it echoed back by
#     the fish line editor. The string below is FISH_PROMPT_SETUP from
#     `terminal-fish.js` verbatim: the `\x1b` / `\x07` escapes must reach fish
#     as literal backslash sequences for its `printf` to build the bytes at
#     runtime (a contract test compares this value with the exported constant);
#   - `terminal-tools`    the official tool package; `tools` is NOT isolated,
#     so its six `terminal_*` tools register into the host registry and are
#     visible to agents;
#   - `fish-terminal-tools` this bundle's `terminalTools` policy, mounted in the
#     same group so its scope matches the session surface (`deny` restricts the
#     six explicit names per agent; `allow` is the default no-op).
# The host-plane rows above (bash disabled + fish-shell/tool-fish/
# fish-preset-policy) are untouched: `ctx.shell` and the one-shot `fish` tool
# keep their exact code path.
- insert:
    - id: fish-terminal-group
      name: 'cordis:group'
      group: true
      isolate:
        terminals: true
      config:
        - id: pty
          name: '@deepseek-ai/dsh-terminal'

        - id: terminal-fish-pty
          name: '@banbolee/dsh-fish-shell/terminal'
          config:
            shellPath: fish
            shellArgs: ["--no-config","-i","-C","function fish_greeting; end; function fish_prompt; printf '\\x1b]133;D;%s\\x07' $status; echo -n 'dsh> '; end; function fish_right_prompt; end;"]
            timeoutMs: 300000

        - id: terminal-tools
          name: '@deepseek-ai/dsh-tool-terminal'

        - id: fish-terminal-tools
          name: '@banbolee/dsh-fish-shell/terminal-tools'
          config:
            terminalTools: allow
