# dsh-fish-shell bundle: make fish the default shell executor instead of bash.
#
# Works across every surface:
#   - dsh-tui / web (agent-preset roster): disables the base bash executor
#     (`bash-sandbox`) and the host bash tool (`tool-bash`), mounts the fish
#     executor (ctx.shell) and a host-global `fish` tool, and points the
#     roster default at the bundled `fish` agent preset (discovered through
#     the package's own `presets/` directory, registered below as a system
#     preset root).
#   - headless (no preset roster; the agent uses host-plane tools): the
#     host-global `fish` tool and the disabled `tool-bash` already make fish
#     the agent's only shell tool.
#
# The model-facing `fish` tool is host-global so every surface sees it; the
# bundled `fish` preset (standard with the shell rows removed) keeps agents
# that select it free of a duplicate or bash shell tool.
- id: bash-sandbox
  disabled: true

- id: tool-bash
  disabled: true

- insert:
    - id: fish-shell
      name: dsh-fish-shell

    - id: tool-fish
      name: dsh-fish-shell/tool

- id: dsh-tui-agent-presets
  config:
    default: fish
    roots: !!js >-
      (() => {
        const base = ctx.baseUrl
        if (!base) return []
        const resolvePath = (url) => {
          const path = decodeURIComponent(url.pathname)
          return /^\/[A-Za-z]:/.test(path) ? path.slice(1) : path
        }
        const system = new URL('../node_modules/@deepseek-ai/dsh/config/agent-presets/', base)
        const own = new URL('./node_modules/dsh-fish-shell/presets/', base)
        return [
          { path: resolvePath(system), trust: 'system' },
          { path: resolvePath(own), trust: 'system' },
        ]
      })()
